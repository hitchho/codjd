# Every setting is optional. Without a config codjd plays ~/Music.
# `path = "~/Music/dj"` alone is a complete config.
path = "/home/user/Music/" # path to media DIRECTORY
sort = "ByDurationDescending" # ByTitleAscending, ByTitleDescending, ByDurationAscending, ByDurationDescending, Shuffle 
repeat = "AllMusics" # Dont, ThisMusic
volume = 0.9 # value beteen 0.0 and 1.0
allow_formats = ["ogg", "flac", "mp3"] # webm, still not supported tho
playlist_save_path = "/home/user/.local/share/codjd/playlist.json" # No default, provide an empty file

# Audio outputs (optional; without this section codjd plays on the default output)
[audio]
# "internal": codj mixes; main = master (PA/speakers), second = headphones (cue)
# "external": codj is only the decks; main = deck A, second = deck B, into a club mixer
mode = "internal"
# "default" or part of a device name (`busctl --user call net.rotko.Codj /net/rotko/Codj
# net.rotko.Codj.Player AudioDevices` lists them)
main = "default"
# empty: no second output
second = ""

# OpenSubsonic API for listening apps (optional; off without this section).
# Users: `codjd user add <name>`. No TLS: use a reverse proxy or WireGuard.
# [net]
# listen = "127.0.0.1:4533"

# Set files (*.codj, see docs/set-language.md); this is the default
# [sets]
# dir = "/home/you/.local/share/codj/sets"

# [record]
# dir = "~/Music/codj-mixes"     # where :rec audio writes the recorded mixes (WAV)

# The player blends each track into the next on the beat (automix); false plays every track to
# its end, as before. This is the default:
# [player]
# automix = true
