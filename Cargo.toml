# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
authors = [
    "yasssine <yassine.bna@proton.me>",
    "Tommi Niemi <tommi@rotko.net>",
]
name = "musad"
version = "0.2.0"
edition = "2021"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/yassinebenarbia/mplayer-server"
description = "musad: music player daemon with built-in Soulseek, controlled over D-Bus"
keywords = ["music", "daemon", "soulseek", "dbus", "audio"]

[dependencies]
zbus = { version = "5.11.0", features = ["tokio"] }
serde = { version = "1.0.204", features = ["serde_derive"] }
lofty = "0.21.0"
regex = "1.11.0"
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tokio = { version = "1.43.0", features = ["full"] }
rand = "0.9.0"
nucleo = "0.5.0"
serde_json = "1.0.141"
flate2 = "1.0"
md5 = "0.7"
dirs = "5.0"
bliss-audio = { version = "0.13", default-features = false, features = ["symphonia-all", "serde"] }
notify = "8"
cpal = { version = "0.18", features = ["pipewire"] }
rtrb = "0.4"
symphonia = { version = "0.6", features = ["all", "opt-simd"] }
ebur128 = "0.1"

[features]
full-log = []
trivial = []
debug = []

# analysis (bliss/fft) and decoding are 10-50x slower unoptimized; keep our own code debuggable
[profile.dev.package."*"]
opt-level = 3
